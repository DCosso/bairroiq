# Atlas Sampa | BairroIQ | Consumer V2 físico auditado.
# A identidade do Databricks App precisa de:
# - Can use no SQL Warehouse associado ao recurso "sql-warehouse"
# - USE CATALOG em workspace, USE SCHEMA em gold
# - SELECT na tabela workspace.gold.bairroiq_frontend_v2
# Não publicar a prévia: o snapshot ainda está com publicacao_autorizada=false.
# Para testar a fotografia candidata, use SOMENTE um ambiente privado,
# com acesso autorizado e BAIRROIQ_INTERNAL_PREVIEW=true configurado
# conscientemente nessa instância. NÃO ativar isso em aplicativo público.
command:
  - streamlit
  - run
  - app.py

env:
  - name: BAIRROIQ_DATA_PROVIDER
    value: databricks
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_METRICS_TABLE
    value: workspace.gold.bairroiq_frontend_v2
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
