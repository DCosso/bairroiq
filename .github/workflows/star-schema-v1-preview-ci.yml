name: BairroIQ - Star Schema v1 Preview CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "barrioiq_pipeline/star_schema_v1_preview.py"
      - "barrioiq_pipeline/requirements-ml.txt"
      - "tests/test_star_schema_v1_preview.py"
      - ".github/workflows/star-schema-v1-preview-ci.yml"
      - "docs/modelagem/**"
      - "docs/governanca/encerramento_auditoria_semantica_v3.md"
  pull_request:
    branches: [main]
    paths:
      - "barrioiq_pipeline/star_schema_v1_preview.py"
      - "barrioiq_pipeline/requirements-ml.txt"
      - "tests/test_star_schema_v1_preview.py"
      - ".github/workflows/star-schema-v1-preview-ci.yml"
      - "docs/modelagem/**"
      - "docs/governanca/encerramento_auditoria_semantica_v3.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview:
    name: Star Schema - grains, keys and safety gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ML dependencies
        run: python -m pip install --disable-pip-version-check -r barrioiq_pipeline/requirements-ml.txt
      - name: Compile
        run: |
          python -m py_compile \
            barrioiq_pipeline/star_schema_v1_preview.py \
            tests/test_star_schema_v1_preview.py
      - name: Synthetic contract tests
        run: python -m unittest discover -s tests -p 'test_star_schema_v1_preview.py' -v
      - name: Verify read-only module and dimension contracts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          module = Path('barrioiq_pipeline/star_schema_v1_preview.py')
          tree = ast.parse(module.read_text(encoding='utf-8'))
          disallowed = {'saveAsTable', 'insertInto', 'writeTo', 'sql', 'execute', 'save', 'createOrReplaceTempView'}
          for item in ast.walk(tree):
              if isinstance(item, ast.Attribute) and item.attr in disallowed:
                  raise AssertionError(f'Blocked Spark/SQL mutation: {item.attr}')
          print('BAIRROIQ_STAR_SCHEMA_V1_READ_ONLY_CI_PASS')
          PY
