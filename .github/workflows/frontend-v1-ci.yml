name: BairroIQ - Frontend Consumer v1 CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "barrioiq_pipeline/frontend_v1_runner.py"
      - "tests/test_frontend_v1_runner.py"
      - ".github/workflows/frontend-v1-ci.yml"
      - "docs/consumo/frontend_v1_*.md"
  pull_request:
    branches: [main]
    paths:
      - "barrioiq_pipeline/frontend_v1_runner.py"
      - "tests/test_frontend_v1_runner.py"
      - ".github/workflows/frontend-v1-ci.yml"
      - "docs/consumo/frontend_v1_*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Frontend v1 - read-only consumer contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r barrioiq_pipeline/requirements-ml.txt
      - name: Compile and test
        run: |
          python -m py_compile barrioiq_pipeline/frontend_v1_runner.py tests/test_frontend_v1_runner.py
          python -m unittest discover -s tests -p 'test_frontend_v1_runner.py' -v
      - name: Protect against autonomous writes and publication
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          file = Path('barrioiq_pipeline/frontend_v1_runner.py')
          tree = ast.parse(file.read_text(encoding='utf-8'))
          prohibited = {'saveAsTable', 'insertInto', 'writeTo',
                        'createOrReplaceTempView', 'createOrReplaceGlobalTempView'}
          attrs = {n.attr for n in ast.walk(tree) if isinstance(n, ast.Attribute)}
          assert not (attrs & prohibited), attrs & prohibited
          source = file.read_text(encoding='utf-8')
          assert 'publicacao_autorizada' in source
          assert 'MATERIALIZAR_SNAPSHOT_INTERNO_SEM_PUBLICACAO' not in source
          print('BAIRROIQ_FRONTEND_V1_READ_ONLY_CI_PASS')
          PY
