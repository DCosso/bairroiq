# ============================================================
# BairroIQ | CD Deploy | 7 jobs | Guarded deployment
# ============================================================
# Executa somente na main. A Gold e implantada exclusivamente
# como job de validacao --check, sem executar o runner.
# O Job Bronze somente e executado se houve alteracao em
# arquivos da propria Bronze no push para main.
# ============================================================

name: BarrioIQ - Databricks CD Deploy

on:
  push:
    branches:
      - main
    paths:
      - "barrioiq_pipeline/**"
      - ".github/workflows/databricks-cd-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barrioiq-databricks-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy guarded BairroIQ Bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: databricks-dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: pat
      BARRIOIQ_JOB_ID: ${{ vars.BARRIOIQ_EXISTING_JOB_ID }}

    steps:
      # ------------------------------------------------------
      # 01. CHECKOUT E TESTES LOCAIS
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate quality and Gold unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_barrioiq_quality.py' -v
          python -m unittest discover -s tests -p 'test_gold_distritos_wide_runner.py' -v
          python -m py_compile barrioiq_pipeline/gold_distritos_wide_runner.py
          python barrioiq_pipeline/bronze_ddl_runner.py

      - name: Determine whether Bronze changed
        id: bronze_changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          before = event.get('before')
          after = os.environ['GITHUB_SHA']
          changed = []
          if before and before != '0' * 40:
              result = subprocess.run(
                  ['git', 'diff', '--name-only', before, after],
                  text=True, capture_output=True, check=True,
              )
              changed = [p.strip() for p in result.stdout.splitlines() if p.strip()]
          run_bronze = any(
              p.startswith('barrioiq_pipeline/') and 'bronze' in p.lower()
              for p in changed
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"run={'true' if run_bronze else 'false'}\n")
          print(f'CHANGED_FILES: {len(changed)}')
          print(f'EXECUTE_BRONZE_AFTER_DEPLOY: {run_bronze}')
          PY

      # ------------------------------------------------------
      # 02. CLI E AUTENTICACAO
      # ------------------------------------------------------
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Obtain scoped OAuth token
        shell: bash
        env:
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = os.environ['DATABRICKS_HOST'].rstrip('/')
          client_id = os.environ['DATABRICKS_CLIENT_ID']
          secret = os.environ['DATABRICKS_CLIENT_SECRET']
          if not all((host, client_id, secret)):
              raise RuntimeError('Missing OAuth configuration')
          credentials = base64.b64encode(f'{client_id}:{secret}'.encode()).decode()
          request = Request(
              f'{host}/oidc/v1/token',
              data=urlencode({'grant_type': 'client_credentials',
                              'scope': 'jobs workspace'}).encode(),
              headers={'Authorization': f'Basic {credentials}',
                       'Content-Type': 'application/x-www-form-urlencoded'},
              method='POST',
          )
          with urlopen(request, timeout=30) as response:
              token = json.load(response)['access_token']
          print(f'::add-mask::{token}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'DATABRICKS_TOKEN={token}\n')
          print('OAUTH_AUTHENTICATION_SUCCESS')
          PY

      # ------------------------------------------------------
      # 03. SNAPSHOT DO SMOKE E VINCULO EXISTENTE
      # ------------------------------------------------------
      - name: Verify and snapshot existing quality Job
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected_id = '604667021938916'
          if os.environ['BARRIOIQ_JOB_ID'] != expected_id:
              raise RuntimeError('Unexpected quality Job ID')
          result = subprocess.run(
              ['databricks', 'jobs', 'get', expected_id, '--output', 'json'],
              text=True, capture_output=True, check=True,
          )
          job = json.loads(result.stdout)
          settings = job.get('settings') or {}
          if str(job.get('job_id')) != expected_id:
              raise RuntimeError('Quality Job ID mismatch')
          if not settings.get('name', '').endswith('barrioiq-smoke-job'):
              raise RuntimeError('Unexpected quality Job name')
          tasks = {t['task_key']: t for t in settings.get('tasks', [])}
          if set(tasks) != {'validar_ambiente', 'validar_qualidade'}:
              raise RuntimeError('Unexpected quality Job tasks')
          if tasks['validar_qualidade'].get('depends_on') != [
              {'task_key': 'validar_ambiente'}
          ]:
              raise RuntimeError('Unexpected quality Job dependency')
          (Path(os.environ['RUNNER_TEMP']) / 'quality-before.json').write_text(
              json.dumps(job), encoding='utf-8',
          )
          print('QUALITY_JOB_VERIFIED')
          PY

      # ------------------------------------------------------
      # 04. VALIDAR BUNDLE E PLANO
      # ------------------------------------------------------
      - name: Validate Bundle
        working-directory: barrioiq_pipeline
        run: databricks bundle validate --target dev

      - name: Verify existing Bundle binding
        working-directory: barrioiq_pipeline
        shell: bash
        run: |
          set -euo pipefail
          databricks bundle summary --target dev --output json > "$RUNNER_TEMP/bundle-before.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'bundle-before.json').read_text(
                  encoding='utf-8'
              )
          )
          jobs = ((data.get('resources') or {}).get('jobs') or {})
          smoke = jobs.get('barrioiq_smoke_job') or {}
          if str(smoke.get('id')) != os.environ['BARRIOIQ_JOB_ID']:
              raise RuntimeError('Bundle is not bound to expected quality Job')
          print('QUALITY_JOB_BINDING_VERIFIED')
          PY

      - name: Generate deployment plan
        working-directory: barrioiq_pipeline
        shell: bash
        run: |
          set -euo pipefail
          databricks bundle plan --target dev --output json > "$RUNNER_TEMP/bairroiq-plan.json"

      - name: Verify planned changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          data = json.loads((temp / 'bairroiq-plan.json').read_text(encoding='utf-8'))
          if not isinstance(data, dict) or not isinstance(data.get('plan'), dict):
              raise RuntimeError('Unexpected deployment plan format')

          # Nomes do Bundle, nao nomes exibidos dos jobs.
          allowed = {
              'barrioiq_smoke_job': {'skip'},
              'bairroiq_bronze_ddl_job': {'create', 'skip'},
              'bairroiq_silver_ibge_check_job': {'create', 'skip'},
              'bairroiq_silver_ssp_check_job': {'update', 'skip'},
              'bairroiq_silver_observasampa_check_job': {'create', 'skip'},
              'bairroiq_silver_geosampa_check_job': {'create', 'skip'},
              'bairroiq_gold_wide_check_job': {'create', 'skip'},
          }
          if len(allowed) != 7:
              raise RuntimeError('Expected seven jobs')

          def identify(resource):
              for prefix in ('resources.jobs.', 'resources_jobs.'):
                  if resource.startswith(prefix):
                      suffix = resource[len(prefix):]
                      if suffix in allowed:
                          return suffix
              raise RuntimeError(f'Unexpected resource: {resource}')

          seen = set()
          for resource, change in sorted(data['plan'].items()):
              if not isinstance(change, dict):
                  raise RuntimeError(f'Invalid plan entry: {resource}')
              key = identify(resource)
              if key in seen:
                  raise RuntimeError(f'Duplicate job identity: {key}')
              seen.add(key)
              action = change.get('action')
              if action not in allowed[key]:
                  raise RuntimeError(f'Blocked action: {resource} -> {action}')

              # Excepcao legada do SSP: somente o update ja previsto
              # para a migracao de dependencias e aceito.
              if key == 'bairroiq_silver_ssp_check_job' and action == 'update':
                  before = json.loads(
                      (temp / 'bundle-before.json').read_text(encoding='utf-8')
                  )
                  jobs = ((before.get('resources') or {}).get('jobs') or {})
                  sid = str((jobs.get(key) or {}).get('id') or '')
                  if not sid.isdigit():
                      raise RuntimeError('SSP update: existing binding missing')
                  response = subprocess.run(
                      ['databricks', 'jobs', 'get', sid, '--output', 'json'],
                      check=True, capture_output=True, text=True,
                  )
                  existing = json.loads(response.stdout)
                  settings = existing.get('settings') or {}
                  envs = settings.get('environments') or []
                  if (
                      str(existing.get('job_id')) != sid
                      or not settings.get('name', '').endswith(
                          'bairroiq-silver-ssp-check-job'
                      )
                      or len(envs) != 1
                      or envs[0].get('environment_key') != 'ssp_serverless'
                      or str((envs[0].get('spec') or {}).get('environment_version')) != '2'
                      or (envs[0].get('spec') or {}).get('dependencies')
                      != ['geopandas==1.1.1']
                  ):
                      raise RuntimeError('SSP update blocked: unexpected legacy settings')
                  print('SSP_LEGACY_DEPENDENCIES_VERIFIED')

              print(f'APPROVED: {resource} -> {action}')

          print('SEVEN_JOB_DEPLOYMENT_PLAN_APPROVED')
          PY

      # ------------------------------------------------------
      # 05. DEPLOY: NAO EXECUTA NENHUM JOB POR SI SO
      # ------------------------------------------------------
      - name: Deploy approved plan
        working-directory: barrioiq_pipeline
        shell: bash
        run: |
          set -euo pipefail
          databricks bundle deploy \
            --target dev \
            --plan "$RUNNER_TEMP/bairroiq-plan.json" \
            --auto-approve \
            --fail-on-active-runs

      # ------------------------------------------------------
      # 06. AUDITORIA DOS SETE JOBS PUBLICADOS
      # ------------------------------------------------------
      - name: Verify deployed Jobs
        working-directory: barrioiq_pipeline
        shell: bash
        run: |
          set -euo pipefail
          databricks bundle summary --target dev --output json > "$RUNNER_TEMP/bundle-after.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          def get_job(job_id):
              result = subprocess.run(
                  ['databricks', 'jobs', 'get', str(job_id), '--output', 'json'],
                  check=True, capture_output=True, text=True,
              )
              return json.loads(result.stdout)

          after = json.loads((temp / 'bundle-after.json').read_text(encoding='utf-8'))
          before = json.loads((temp / 'bundle-before.json').read_text(encoding='utf-8'))
          jobs = ((after.get('resources') or {}).get('jobs') or {})
          known = {
              'barrioiq_smoke_job',
              'bairroiq_bronze_ddl_job',
              'bairroiq_silver_ibge_check_job',
              'bairroiq_silver_ssp_check_job',
              'bairroiq_silver_observasampa_check_job',
              'bairroiq_silver_geosampa_check_job',
              'bairroiq_gold_wide_check_job',
          }
          require(set(jobs) == known, 'Unexpected deployed jobs')
          ids = {key: str(jobs[key].get('id') or '') for key in known}
          require(all(i.isdigit() for i in ids.values()), 'Invalid Job ID')
          require(len(set(ids.values())) == 7, 'Duplicate Job IDs')

          smoke_id = ids['barrioiq_smoke_job']
          require(smoke_id == os.environ['BARRIOIQ_JOB_ID'],
                  'Quality Job binding changed')
          snapshot = json.loads((temp / 'quality-before.json').read_text(encoding='utf-8'))
          smoke_after = get_job(smoke_id)
          require(snapshot.get('settings') == smoke_after.get('settings'),
                  'Quality Job settings changed')
          print('QUALITY_JOB_SETTINGS_PRESERVED')

          # Preservar vinculacoes dos jobs existentes, quando presentes.
          before_jobs = ((before.get('resources') or {}).get('jobs') or {})
          for key in known - {'bairroiq_gold_wide_check_job'}:
              previous_id = str((before_jobs.get(key) or {}).get('id') or '')
              require(previous_id and previous_id == ids[key],
                      f'Existing job binding changed: {key}')
          print('EXISTING_SIX_JOB_BINDINGS_PRESERVED')

          expected = {
              'bairroiq_bronze_ddl_job': {
                  'name': 'bairroiq-bronze-ddl-job',
                  'env': None,
                  'tasks': {
                      'validar_ddls_bronze': [],
                      'aplicar_ddls_bronze': ['--apply'],
                  },
              },
              'bairroiq_silver_ibge_check_job': {
                  'name': 'bairroiq-silver-ibge-check-job',
                  'env': 'silver_serverless',
                  'timeout': 900, 'task_timeout': 600,
                  'script': 'silver_ibge_runner.py',
              },
              'bairroiq_silver_ssp_check_job': {
                  'name': 'bairroiq-silver-ssp-check-job',
                  'env': 'ssp_serverless',
                  'timeout': 2400, 'task_timeout': 2100,
                  'script': 'silver_ssp_spatial_runner.py',
                  'deps': ['geopandas==1.1.1', 'numpy==1.26.4',
                           'pandas==2.2.3', 'pyarrow==14.0.1'],
              },
              'bairroiq_silver_observasampa_check_job': {
                  'name': 'bairroiq-silver-observasampa-check-job',
                  'env': 'observasampa_serverless',
                  'timeout': 1800, 'task_timeout': 1500,
                  'script': 'silver_observasampa_runner.py',
              },
              'bairroiq_silver_geosampa_check_job': {
                  'name': 'bairroiq-silver-geosampa-check-job',
                  'env': 'geosampa_serverless',
                  'timeout': 1800, 'task_timeout': 1500,
                  'script': 'silver_geosampa_runner.py',
              },
              'bairroiq_gold_wide_check_job': {
                  'name': 'bairroiq-gold-wide-check-job',
                  'env': 'gold_serverless',
                  'timeout': 3600, 'task_timeout': 3300,
                  'script': 'gold_distritos_wide_runner.py',
              },
          }

          for key, contract in expected.items():
              job_id = ids[key]
              payload = get_job(job_id)
              require(str(payload.get('job_id')) == job_id,
                      f'{key}: Job ID mismatch')
              settings = payload.get('settings') or {}
              require(settings.get('name', '').endswith(contract['name']),
                      f'{key}: Unexpected job name')
              require(settings.get('max_concurrent_runs') == 1,
                      f'{key}: Invalid concurrency')
              require(not any(settings.get(k) for k in ('schedule', 'trigger', 'continuous')),
                      f'{key}: Automatic scheduling forbidden')
              require(not settings.get('job_clusters'),
                      f'{key}: Dedicated clusters forbidden')
              if key == 'bairroiq_bronze_ddl_job':
                  task_dict = {t['task_key']: t for t in settings.get('tasks', [])}
                  require(set(task_dict) == set(contract['tasks']),
                          'Bronze task set changed')
                  validate = task_dict['validar_ddls_bronze']
                  apply = task_dict['aplicar_ddls_bronze']
                  require(not validate.get('depends_on'),
                          'Bronze validation dependency changed')
                  require(apply.get('depends_on') == [{'task_key': 'validar_ddls_bronze'}],
                          'Bronze apply dependency changed')
                  require(apply.get('run_if', 'ALL_SUCCESS') == 'ALL_SUCCESS',
                          'Bronze apply run_if changed')
                  for task_key, params in contract['tasks'].items():
                      task = task_dict[task_key]
                      script = task.get('spark_python_task') or {}
                      require((script.get('parameters') or []) == params,
                              f'Bronze parameters changed: {task_key}')
                      require(script.get('source') == 'WORKSPACE',
                              'Bronze script source changed')
                      require(script.get('python_file', '').endswith('/bronze_ddl_runner.py'),
                              'Bronze runner changed')
                      require(task.get('max_retries', 0) == 0,
                              'Bronze automatic retries forbidden')
                      require(not task.get('disabled'),
                              'Bronze task disabled')
                  print('BRONZE_JOB_SETTINGS_VERIFIED')
                  continue

              # Um unico --check para as quatro Silver e para a Gold.
              require(settings.get('timeout_seconds') == contract['timeout'],
                      f'{key}: Incorrect job timeout')
              require((settings.get('queue') or {}).get('enabled') is True,
                      f'{key}: Queue must be enabled')
              tasks = settings.get('tasks') or []
              require(len(tasks) == 1, f'{key}: Expected exactly one task')
              task = tasks[0]
              require(task.get('max_retries', 0) == 0,
                      f'{key}: Automatic retries forbidden')
              require(not task.get('disabled'), f'{key}: Task disabled')
              require(not task.get('depends_on'), f'{key}: Unexpected dependency')
              require(task.get('timeout_seconds') == contract['task_timeout'],
                      f'{key}: Unexpected task timeout')
              require(task.get('environment_key') == contract['env'],
                      f'{key}: Wrong task environment')
              require(not any(k in task for k in
                              ('new_cluster', 'existing_cluster_id', 'job_cluster_key')),
                      f'{key}: Dedicated cluster forbidden')
              script = task.get('spark_python_task') or {}
              require(script.get('source') == 'WORKSPACE',
                      f'{key}: Incorrect runner source')
              require(script.get('python_file', '').endswith('/' + contract['script']),
                      f'{key}: Incorrect runner')
              require(script.get('parameters') == ['--check'],
                      f'{key}: ONLY --check is allowed')
              require(task.get('task_key') == (
                  'validar_gold_distritos_wide'
                  if key == 'bairroiq_gold_wide_check_job'
                  else {
                      'bairroiq_silver_ibge_check_job': 'validar_silver_ibge',
                      'bairroiq_silver_ssp_check_job': 'validar_silver_ssp_spatial',
                      'bairroiq_silver_observasampa_check_job': 'validar_silver_observasampa',
                      'bairroiq_silver_geosampa_check_job': 'validar_silver_geosampa',
                  }[key]
              ), f'{key}: Unexpected task key')
              envs = settings.get('environments') or []
              require(len(envs) == 1 and envs[0].get('environment_key') == contract['env'],
                      f'{key}: Invalid environment')
              spec = envs[0].get('spec') or {}
              require(str(spec.get('environment_version')) == '2',
                      f'{key}: Serverless v2 required')
              deps = contract.get('deps')
              if deps is None:
                  require(not spec.get('dependencies'),
                          f'{key}: Unexpected dependencies')
              else:
                  require(spec.get('dependencies') == deps,
                          f'{key}: Unexpected dependencies')
              print(f'JOB_SETTINGS_VERIFIED: {key}')

          print(f'GOLD_WIDE_JOB_ID: {ids["bairroiq_gold_wide_check_job"]}')
          print('SEVEN_JOB_DEPLOYMENT_VERIFIED')
          print('GOLD_JOB_DEPLOYED_NOT_EXECUTED')
          print('BARRIOIQ_CD_DEPLOY_SUCCESS')
          PY

      # ------------------------------------------------------
      # 07. EXECUCAO OPCIONAL DA BRONZE: APENAS ALTERACOES BRONZE
      # ------------------------------------------------------
      - name: Execute Bronze DDL Job when Bronze changed
        if: steps.bronze_changes.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = os.environ['DATABRICKS_HOST'].rstrip('/')
          token = os.environ['DATABRICKS_TOKEN']
          temp = Path(os.environ['RUNNER_TEMP'])
          summary = json.loads((temp / 'bundle-after.json').read_text(encoding='utf-8'))
          jobs = summary['resources']['jobs']
          bronze_id = str(jobs['bairroiq_bronze_ddl_job']['id'])
          smoke_id = str(jobs['barrioiq_smoke_job']['id'])
          if not bronze_id.isdigit() or bronze_id == smoke_id:
              raise RuntimeError('Invalid Bronze Job identity')

          def request_api(endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(
                  f'{host}/api/2.1/{endpoint}',
                  data=data,
                  headers={'Authorization': f'Bearer {token}',
                           'Content-Type': 'application/json'},
                  method='GET' if data is None else 'POST',
              )
              with urlopen(req, timeout=30) as response:
                  return json.load(response)

          response = request_api('jobs/run-now', {
              'job_id': int(bronze_id),
              'idempotency_token': (
                  f'bairroiq-bronze-{os.environ["GITHUB_RUN_ID"]}-'
                  f'{os.environ["GITHUB_RUN_ATTEMPT"]}'
              ),
          })
          run_id = str(response.get('run_id') or '')
          if not run_id.isdigit():
              raise RuntimeError('Missing Bronze run ID')
          print(f'BRONZE_RUN_ID: {run_id}', flush=True)

          end = time.monotonic() + 35 * 60
          terminal = {'TERMINATED', 'SKIPPED', 'INTERNAL_ERROR'}
          expected = {'validar_ddls_bronze', 'aplicar_ddls_bronze'}
          while time.monotonic() < end:
              run = request_api('jobs/runs/get?' + urlencode({'run_id': run_id}))
              if str(run.get('run_id')) != run_id or str(run.get('job_id')) != bronze_id:
                  raise RuntimeError('Run identity mismatch')
              state = run.get('state') or {}
              lifecycle = state.get('life_cycle_state')
              result = state.get('result_state')
              if lifecycle in terminal:
                  states = {
                      t['task_key']: (t.get('state') or {}).get('result_state')
                      for t in run.get('tasks') or []
                  }
                  if result != 'SUCCESS' or set(states) != expected or any(
                      s != 'SUCCESS' for s in states.values()
                  ):
                      raise RuntimeError(f'Bronze run failed: {lifecycle}/{result} {states}')
                  print('BARRIOIQ_CD_BRONZE_SUCCESS')
                  break
              time.sleep(15)
          else:
              raise TimeoutError(f'Bronze run {run_id} exceeded 35 minutes')
          PY

      - name: Deployment completed
        run: |
          echo 'BARRIOIQ_CD_DEPLOY_SUCCESS'
          echo 'Gold job is deployed read-only and was not executed.'
          echo 'Bronze executes only when Bronze files changed.'
