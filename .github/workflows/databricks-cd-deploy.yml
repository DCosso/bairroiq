name: BarrioIQ - Databricks CD Deploy

on:
  push:
    branches:
      - main
    paths:
      - "barrioiq_pipeline/**"
      - ".github/workflows/databricks-cd-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barrioiq-databricks-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy BarrioIQ Databricks Jobs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: databricks-dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: pat
      BARRIOIQ_JOB_ID: ${{ vars.BARRIOIQ_EXISTING_JOB_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data quality tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_barrioiq_quality.py" \
            -v

      - name: Validate Bronze DDL files without applying
        run: python barrioiq_pipeline/bronze_ddl_runner.py

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Obtain scoped OAuth token
        shell: bash
        env:
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = os.environ["DATABRICKS_HOST"].rstrip("/")
          client_id = os.environ["DATABRICKS_CLIENT_ID"]
          secret = os.environ["DATABRICKS_CLIENT_SECRET"]

          if not all((host, client_id, secret)):
              raise RuntimeError("Missing OAuth configuration")

          credentials = base64.b64encode(
              f"{client_id}:{secret}".encode()
          ).decode()

          request = Request(
              f"{host}/oidc/v1/token",
              data=urlencode({
                  "grant_type": "client_credentials",
                  "scope": "jobs workspace",
              }).encode(),
              headers={
                  "Authorization": f"Basic {credentials}",
                  "Content-Type": "application/x-www-form-urlencoded",
              },
              method="POST",
          )

          with urlopen(request, timeout=30) as response:
              token = json.load(response)["access_token"]

          print(f"::add-mask::{token}")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DATABRICKS_TOKEN={token}\n")

          print("OAuth authentication OK")
          PY

      - name: Verify and snapshot existing quality Job
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected_id = "604667021938916"

          if os.environ["BARRIOIQ_JOB_ID"] != expected_id:
              raise RuntimeError("Unexpected quality Job ID")

          result = subprocess.run(
              ["databricks", "jobs", "get", expected_id, "--output", "json"],
              check=True,
              capture_output=True,
              text=True,
          )
          job = json.loads(result.stdout)
          settings = job.get("settings") or {}

          if str(job.get("job_id")) != expected_id:
              raise RuntimeError("Quality Job ID mismatch")

          if not settings.get("name", "").endswith("barrioiq-smoke-job"):
              raise RuntimeError("Unexpected quality Job name")

          tasks = {
              task["task_key"]: task
              for task in settings.get("tasks", [])
          }

          if set(tasks) != {"validar_ambiente", "validar_qualidade"}:
              raise RuntimeError("Unexpected quality Job tasks")

          if tasks["validar_qualidade"].get("depends_on") != [
              {"task_key": "validar_ambiente"}
          ]:
              raise RuntimeError("Unexpected quality Job dependency")

          path = Path(os.environ["RUNNER_TEMP"]) / "quality-before.json"
          path.write_text(json.dumps(job), encoding="utf-8")

          print("QUALITY_JOB_VERIFIED")
          PY

      - name: Validate Bundle
        working-directory: barrioiq_pipeline
        run: databricks bundle validate --target dev

      - name: Verify existing Bundle binding
        working-directory: barrioiq_pipeline
        shell: bash
        run: |
          databricks bundle summary \
            --target dev \
            --output json > "$RUNNER_TEMP/bundle-before.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "bundle-before.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          jobs = (data.get("resources") or {}).get("jobs") or {}
          smoke = jobs.get("barrioiq_smoke_job") or {}

          if str(smoke.get("id")) != os.environ["BARRIOIQ_JOB_ID"]:
              raise RuntimeError(
                  "Bundle is not bound to the expected quality Job"
              )

          print("QUALITY_JOB_BINDING_VERIFIED")
          PY

      - name: Generate deployment plan
        working-directory: barrioiq_pipeline
        run: |
          databricks bundle plan \
            --target dev \
            --output json > "$RUNNER_TEMP/bairroiq-plan.json"

      - name: Verify planned changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "bairroiq-plan.json"
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise RuntimeError("Invalid deployment plan document")

          if "plan" not in data or not isinstance(data["plan"], dict):
              raise RuntimeError("Unexpected deployment plan format")

          allowed_actions = {
              "resources.jobs.barrioiq_smoke_job": {"skip"},
              "resources.jobs.bairroiq_bronze_ddl_job": {"create", "skip"},
          }

          for resource, change in data["plan"].items():
              if resource not in allowed_actions:
                  raise RuntimeError(f"Unexpected resource: {resource}")

              if not isinstance(change, dict):
                  raise RuntimeError(f"Invalid change: {resource}")

              action = change.get("action")

              if action not in allowed_actions[resource]:
                  raise RuntimeError(
                      f"Blocked action: {resource} -> {action}"
                  )

              print(f"APPROVED: {resource} -> {action}")

          print("DEPLOYMENT_PLAN_APPROVED")
          PY

      - name: Deploy approved plan
        working-directory: barrioiq_pipeline
        run: |
          databricks bundle deploy \
            --target dev \
            --plan "$RUNNER_TEMP/bairroiq-plan.json" \
            --auto-approve \
            --fail-on-active-runs

      - name: Verify deployed Jobs
        working-directory: barrioiq_pipeline
        shell: bash
        run: |
          databricks bundle summary \
            --target dev \
            --output json > "$RUNNER_TEMP/bundle-after.json"

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def get_job(job_id):
              result = subprocess.run(
                  [
                      "databricks", "jobs", "get",
                      str(job_id), "--output", "json",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)

          summary = json.loads(
              (temp / "bundle-after.json").read_text(encoding="utf-8")
          )
          jobs = (summary.get("resources") or {}).get("jobs") or {}

          require(
              set(jobs) == {
                  "barrioiq_smoke_job",
                  "bairroiq_bronze_ddl_job",
              },
              "Unexpected deployed Jobs",
          )

          smoke_id = str(jobs["barrioiq_smoke_job"].get("id"))
          bronze_id = str(jobs["bairroiq_bronze_ddl_job"].get("id"))

          require(
              smoke_id == os.environ["BARRIOIQ_JOB_ID"],
              "Quality Job binding changed",
          )
          require(
              bronze_id.isdigit() and bronze_id != smoke_id,
              "Invalid Bronze Job ID",
          )

          before = json.loads(
              (temp / "quality-before.json").read_text(encoding="utf-8")
          )
          after = get_job(smoke_id)

          require(
              before.get("settings") == after.get("settings"),
              "Quality Job settings changed; review required",
          )
          print("QUALITY_JOB_SETTINGS_PRESERVED")

          bronze = get_job(bronze_id)
          require(
              str(bronze.get("job_id")) == bronze_id,
              "Bronze Job ID mismatch",
          )

          settings = bronze.get("settings") or {}
          require(
              settings.get("name", "").endswith("bairroiq-bronze-ddl-job"),
              "Unexpected Bronze Job name",
          )

          for field in ("schedule", "trigger", "continuous"):
              require(
                  not settings.get(field),
                  f"Unexpected Bronze scheduling configuration: {field}",
              )

          tasks = {
              task["task_key"]: task
              for task in settings.get("tasks", [])
          }
          require(
              set(tasks) == {"validar_ddls_bronze", "aplicar_ddls_bronze"},
              "Unexpected Bronze tasks",
          )

          validate = tasks["validar_ddls_bronze"]
          apply = tasks["aplicar_ddls_bronze"]

          require(
              not validate.get("depends_on"),
              "Unexpected validation dependency",
          )
          require(
              not validate.get("spark_python_task", {}).get("parameters"),
              "Validation task received unexpected parameters",
          )
          require(
              apply.get("depends_on")
              == [{"task_key": "validar_ddls_bronze"}],
              "Unexpected Bronze application dependency",
          )
          require(
              apply.get("run_if", "ALL_SUCCESS") == "ALL_SUCCESS",
              "Unexpected Bronze execution condition",
          )
          require(
              apply.get("spark_python_task", {}).get("parameters")
              == ["--apply"],
              "Unexpected Bronze application parameters",
          )

          for task in (validate, apply):
              script = task.get("spark_python_task") or {}
              path = script.get("python_file", "")
              require(
                  path.endswith("/bronze_ddl_runner.py"),
                  "Unexpected Bronze runner path",
              )
              require(
                  script.get("source") == "WORKSPACE",
                  "Unexpected Bronze script source",
              )
              require(
                  not task.get("disabled"),
                  "Bronze task is disabled",
              )

          print(f"QUALITY_JOB_ID: {smoke_id}")
          print(f"BRONZE_JOB_ID: {bronze_id}")
          print("BRONZE_JOB_DEPLOYED_NOT_EXECUTED")
          print("BARRIOIQ_CD_SUCCESS")
          PY
