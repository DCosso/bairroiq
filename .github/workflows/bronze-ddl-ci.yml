name: Bronze SQL CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "feature/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bronze-sql:
    name: Validate Bronze SQL
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile barrioiq_pipeline/bronze_ddl_runner.py

      - name: Validate all five Bronze DDLs without applying
        run: python barrioiq_pipeline/bronze_ddl_runner.py

      - name: Test Bronze DDL validation rules
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import shutil
          import unittest

          runner_path = Path("barrioiq_pipeline/bronze_ddl_runner.py")
          spec = importlib.util.spec_from_file_location(
              "bronze_runner", runner_path
          )
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          source = runner_path.parent / "sql" / "bronze"

          class BronzeDDLTests(unittest.TestCase):
              def setUp(self):
                  self.temp = TemporaryDirectory()
                  self.addCleanup(self.temp.cleanup)
                  self.root = Path(self.temp.name) / "bronze"
                  shutil.copytree(source, self.root)

              def test_valid_files(self):
                  self.assertEqual(
                      len(runner.validate_files(self.root)), 5
                  )

              def test_missing_file(self):
                  (self.root / "001_geo_sampa.sql").unlink()
                  with self.assertRaises(ValueError):
                      runner.validate_files(self.root)

              def test_extra_file(self):
                  (self.root / "999_extra.sql").write_text(
                      "SELECT 1;", encoding="utf-8"
                  )
                  with self.assertRaises(ValueError):
                      runner.validate_files(self.root)

              def test_unsafe_statements(self):
                  path = self.root / "001_geo_sampa.sql"
                  original = path.read_text(encoding="utf-8")

                  variants = {
                      "second_statement": (
                          original
                          + "\nDROP TABLE workspace.bronze.imoveis;"
                      ),
                      "replace": original.replace(
                          "CREATE TABLE IF NOT EXISTS",
                          "CREATE OR REPLACE TABLE",
                      ),
                      "wrong_target": original.replace(
                          "workspace.bronze.geo_sampa",
                          "workspace.gold.geo_sampa",
                      ),
                      "non_delta": original.replace(
                          "USING DELTA", "USING PARQUET"
                      ),
                      "ctas": (
                          original.rstrip().rstrip(";")
                          + " AS SELECT 1;"
                      ),
                  }

                  for label, sql in variants.items():
                      with self.subTest(case=label):
                          path.write_text(sql, encoding="utf-8")
                          with self.assertRaises(ValueError):
                              runner.validate_files(self.root)

          unittest.main(verbosity=2)
          PY
