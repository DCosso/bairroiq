
name: BarrioIQ - Data Quality CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-tests:
    name: Validate Data Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data quality tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_barrioiq_quality.py" \
            -v
