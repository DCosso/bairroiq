name: BairroIQ - ML Perfis v2 CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "barrioiq_pipeline/ml_perfis_territoriais_v2.py"
      - "barrioiq_pipeline/requirements-ml.txt"
      - "barrioiq_pipeline/distritos_centroides_ibge_2022.json"
      - "tests/test_ml_perfis_territoriais_v2.py"
      - ".github/workflows/ml-v2-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "barrioiq_pipeline/ml_perfis_territoriais_v2.py"
      - "barrioiq_pipeline/requirements-ml.txt"
      - "barrioiq_pipeline/distritos_centroides_ibge_2022.json"
      - "tests/test_ml_perfis_territoriais_v2.py"
      - ".github/workflows/ml-v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-v2-tests:
    name: Perfis territoriais v2 - contrato e reproducibilidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ML dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r barrioiq_pipeline/requirements-ml.txt
      - name: Validate Python syntax
        run: |
          python -m compileall -q \
            barrioiq_pipeline/ml_perfis_territoriais_v2.py \
            tests/test_ml_perfis_territoriais_v2.py
      - name: Test contract and two clustering algorithms
        run: |
          python -m unittest discover -s tests \
            -p 'test_ml_perfis_territoriais_v2.py' -v
      - name: Confirm read-only exploratory status
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('barrioiq_pipeline/ml_perfis_territoriais_v2.py').read_text()
          assert 'EXPLORATORIO_NAO_HOMOLOGADO' in text
          assert 'ALTER TABLE' not in text.upper()
          assert 'SAVEASTABLE' not in text.upper()
          assert 'INSERT INTO' not in text.upper()
          print('BAIRROIQ_ML_V2_STATIC_SAFETY_OK')
          PY
