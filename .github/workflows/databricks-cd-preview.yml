name: BarrioIQ - Databricks CD Preview

on:
  push:
    branches:
      - feature/bronze-ddl-automation
    paths:
      - "barrioiq_pipeline/**"
      - ".github/workflows/databricks-cd-preview.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barrioiq-databricks-dev
  cancel-in-progress: false

jobs:
  deployment-preview:
    name: Preview Databricks Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: databricks-dev

    defaults:
      run:
        working-directory: barrioiq_pipeline

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Bronze DDL files without applying
        run: python bronze_ddl_runner.py

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Obtain scoped OAuth token
        shell: bash
        env:
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = os.environ["DATABRICKS_HOST"].rstrip("/")
          client_id = os.environ["DATABRICKS_CLIENT_ID"]
          secret = os.environ["DATABRICKS_CLIENT_SECRET"]

          if not all((host, client_id, secret)):
              raise RuntimeError("Missing OAuth configuration")

          credentials = base64.b64encode(
              f"{client_id}:{secret}".encode()
          ).decode()

          request = Request(
              f"{host}/oidc/v1/token",
              data=urlencode({
                  "grant_type": "client_credentials",
                  "scope": "jobs workspace",
              }).encode(),
              headers={
                  "Authorization": f"Basic {credentials}",
                  "Content-Type": "application/x-www-form-urlencoded",
              },
              method="POST",
          )

          with urlopen(request, timeout=30) as response:
              token = json.load(response)["access_token"]

          print(f"::add-mask::{token}")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DATABRICKS_TOKEN={token}\n")

          print("OAuth authentication OK")
          PY

      - name: Validate Databricks Bundle
        run: databricks bundle validate --target dev

      - name: Generate deployment plan
        shell: bash
        run: |
          databricks bundle plan \
            --target dev \
            --output json > "$RUNNER_TEMP/bairroiq-plan.json"

      - name: Inspect and validate planned resource actions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "bairroiq-plan.json"
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise RuntimeError("Invalid deployment plan document")

          if "plan" not in data or not isinstance(data["plan"], dict):
              raise RuntimeError(
                  "Unexpected plan format: expected a 'plan' object"
              )

          plan = data["plan"]

          smoke = "resources.jobs.barrioiq_smoke_job"
          bronze = "resources.jobs.bairroiq_bronze_ddl_job"

          # Politica inicial: preservar o Job atual e permitir
          # somente a criacao do Job Bronze ou recursos inalterados.
          allowed_actions = {
              smoke: {"skip"},
              bronze: {"create", "skip"},
          }

          errors = []

          for resource, change in sorted(plan.items()):
              if not isinstance(change, dict):
                  errors.append(f"Invalid change structure: {resource}")
                  continue

              action = change.get("action")
              fields = change.get("changes")
              if fields is None:
                  fields = {}

              print(f"RESOURCE: {resource}")
              print(f"ACTION: {action}")

              if not isinstance(fields, dict):
                  errors.append(f"Invalid changes structure: {resource}")
                  continue

              for field in sorted(fields):
                  print(f"  FIELD: {field}")

              if resource not in allowed_actions:
                  errors.append(f"Unexpected resource: {resource}")
                  continue

              if action not in allowed_actions[resource]:
                  errors.append(
                      f"Action requires review: {resource} -> {action}"
                  )

          if errors:
              raise RuntimeError("\n".join(errors))

          if not plan:
              print("NO RESOURCE CHANGES")

          print("PREVIEW_RESOURCE_ACTIONS_ACCEPTED")
          print("NO DEPLOYMENT EXECUTED")
          print("NO BRONZE DDL EXECUTED")
          PY

      - name: Preview completed
        run: echo "BARRIOIQ_CD_PREVIEW_SUCCESS"
