
name: BarrioIQ - Databricks CD Preview

on:
  push:
    branches:
      - feature/databricks-initial-setup
    paths:
      - "barrioiq_pipeline/**"
      - ".github/workflows/databricks-cd-preview.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-preview:
    name: Preview Databricks Deployment
    runs-on: ubuntu-latest
    environment: databricks-dev

    defaults:
      run:
        working-directory: barrioiq_pipeline

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: pat

    steps:

      # 1. BAIXAR O REPOSITORIO
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. INSTALAR DATABRICKS CLI
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # 3. AUTENTICACAO OAUTH M2M
      - name: Obtain scoped OAuth token
        shell: bash
        env:
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64

          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = os.environ["DATABRICKS_HOST"].rstrip("/")
          client_id = os.environ["DATABRICKS_CLIENT_ID"]
          client_secret = os.environ["DATABRICKS_CLIENT_SECRET"]

          if not all([host, client_id, client_secret]):
              raise RuntimeError(
                  "Missing Databricks OAuth configuration"
              )

          credentials = base64.b64encode(
              f"{client_id}:{client_secret}".encode()
          ).decode()

          request = Request(
              f"{host}/oidc/v1/token",
              data=urlencode({
                  "grant_type": "client_credentials",
                  "scope": "jobs workspace"
              }).encode(),
              headers={
                  "Authorization": f"Basic {credentials}",
                  "Content-Type":
                      "application/x-www-form-urlencoded"
              },
              method="POST"
          )

          with urlopen(request, timeout=30) as response:
              token = json.load(response)["access_token"]

          print(f"::add-mask::{token}")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:
              env.write(f"DATABRICKS_TOKEN={token}\n")

          print("OAuth authentication successful")
          PY

      # 4. VALIDAR O BUNDLE
      - name: Validate Databricks Bundle
        run: |
          databricks bundle validate --target dev

      # 5. GERAR E INSPECIONAR O PLANO
      - name: Preview deployment changes
        shell: bash
        run: |
          databricks bundle plan \
            --target dev \
            --output json > /tmp/barrioiq-plan.json

          python - <<'PY'
          import json

          with open(
              "/tmp/barrioiq-plan.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          plan = data.get("plan") or {}

          expected_resource = (
              "resources.jobs.barrioiq_smoke_job"
          )

          # Nao aceitar alteracoes em outros recursos.
          if set(plan) != {expected_resource}:
              raise RuntimeError(
                  f"Unexpected resources: {list(plan)}"
              )

          change = plan[expected_resource]
          action = change.get("action")

          # A atualizacao deve afetar o Job existente.
          if action != "update":
              raise RuntimeError(
                  f"Unexpected action: {action}"
              )

          fields = change.get("changes") or {}

          if not isinstance(fields, dict):
              raise RuntimeError(
                  "Unexpected changes structure"
              )

          print("=" * 60)
          print("BARRIOIQ - DATABRICKS CD PREVIEW")
          print("=" * 60)

          print(f"RESOURCE: {expected_resource}")
          print(f"ACTION: {action}")

          print("\nCHANGED FIELDS:")

          for field in sorted(fields):
              print(f" - {field}")

              if (
                  "validar_qualidade" in field
                  and field.endswith("notebook_path")
              ):
                  new_path = fields[field].get("new")

                  print(
                      f"   NEW NOTEBOOK PATH: {new_path}"
                  )

          # Conferir se a nova tarefa esta no plano.
          quality_fields = [
              field
              for field in fields
              if "validar_qualidade" in field
          ]

          if not quality_fields:
              raise RuntimeError(
                  "New quality task not found in plan"
              )

          print("\nQUALITY TASK CHANGES:")

          for field in sorted(quality_fields):
              print(f" - {field}")

          print("\nQUALITY TASK DETECTED IN PLAN")

          # Nenhuma criacao ou exclusao de Job.
          if action != "update":
              raise RuntimeError(
                  "Job creation/deletion is forbidden"
              )

          print("EXISTING JOB WILL BE UPDATED")
          print("NO NEW JOB WILL BE CREATED")
          print("NO JOB WILL BE DELETED")

          print("\nNO DEPLOYMENT EXECUTED")
          print("=" * 60)
          PY

      # 6. FINALIZAR
      - name: Preview completed
        run: |
          echo "BarrioIQ Databricks CD Preview completed"
          echo "No deployment executed"
