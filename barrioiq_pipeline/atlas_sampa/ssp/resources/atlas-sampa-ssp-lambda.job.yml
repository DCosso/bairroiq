resources:
  jobs:
    atlas_sampa_ssp_lambda:
      name: atlas-sampa-ssp-lambda
      description: >-
        Atualizacao mensal privada da SSP-SP: coleta direta, Bronze V2,
        Silver espacial, Batch, Speed multiset e Serving reconciliada.
        Nao altera as tabelas Gold nem o frontend Atlas Sampa.
      max_concurrent_runs: 1
      timeout_seconds: 14400
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: '0 0 10 10 * ?'
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      environments:
        - environment_key: ssp_lambda_serverless
          spec:
            environment_version: '2'
            dependencies:
              - 'openpyxl==3.1.5'
              - 'geopandas==1.1.1'
              - 'numpy==1.26.4'
              - 'pandas==2.2.3'
              - 'pyarrow==14.0.1'
      tasks:
        - task_key: atlas_sampa_ssp_run
          environment_key: ssp_lambda_serverless
          timeout_seconds: 13800
          max_retries: 0
          spark_python_task:
            python_file: ../pipeline.py
            source: WORKSPACE
            parameters:
              - '--run'
              - '--bootstrap-legacy'
